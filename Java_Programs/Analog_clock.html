<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analog Clock</title>
    <link rel="stylesheet" href="Analog_clock.css">
</head>
<body>
    <h1>Analog Clock</h1>
    <div class="clock">
        <div class="center-dot"></div>
        <div class="hand hour-hand"></div>
        <div class="hand minute-hand"></div>
        <div class="hand second-hand"></div>
        <div class="number">
            <span><b> 1 </b></span>
<span><b> 2 </b></span>
<span><b> 3 </b></span>
<span><b> 4 </b></span>
<span><b> 5 </b></span>
<span><b> 6 </b></span>
<span><b> 7 </b></span>
<span><b> 8 </b></span>
<span><b> 9 </b></span>
<span><b> 10 </b></span>
<span><b> 11 </b></span>
<span><b> 12 </b></span>
   </div>


</body>
</html>
